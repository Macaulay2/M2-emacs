name: Build package distribution
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build package distribution
        run: make dist
      - name: Upload package distribution
        uses: actions/upload-artifact@v7
        with:
          name: M2-emacs-package
          path: dist/M2-*.tar
          if-no-files-found: error
